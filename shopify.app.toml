# SmartStock: read-only embedded Shopify inventory dashboard.
# Shopify CLI updates application_url and redirect_urls during local development.
client_id = "de1f4c6999537a02ccb75ff8710ad527"
application_url = "https://example.com"
embedded = true
name = "SmartStock Inventory"

[access_scopes]
scopes = "read_products,read_inventory"

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/webhooks/app/scopes_update"

[auth]
redirect_urls = ["https://example.com/api/auth"]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
